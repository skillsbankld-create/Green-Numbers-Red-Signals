<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Green Numbers, Red Signals · Skills Bank</title>
<style>
:root{--navy:#080828;--teal:#40BDA9;--teal-d:#1E8C7B;--ice:#EBF4FF;--coral:#F26A44;--muted:#5B6485;--line:#CBD9F2;--white:#fff;--green:#2FB67C;--red:#E5484D}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Calibri,Carlito,"Segoe UI",system-ui,sans-serif;background:var(--ice);color:var(--navy);font-size:16px;line-height:1.45}
header.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
header.top img{height:34px}
header.top .t{font-weight:700;font-size:18px;letter-spacing:.01em}
header.top nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
header.top nav a{color:#fff;text-decoration:none;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.25)}
header.top nav a.on{background:var(--teal);color:var(--navy);border-color:var(--teal);font-weight:700}
header.top .snd{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
header.top .snd.on{background:var(--teal);color:var(--navy);border-color:var(--teal);font-weight:700}
main{max-width:1180px;margin:0 auto;padding:18px}
h1{font-size:28px;margin:6px 0 4px}h2{font-size:20px;margin:0 0 8px}h3{font-size:15px;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 14px}
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px;box-shadow:0 2px 8px rgba(8,8,40,.05)}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g3{grid-template-columns:repeat(3,1fr)}.gd{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.btn{appearance:none;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--teal);color:var(--navy);transition:transform .15s,box-shadow .15s}
.btn.sec{background:var(--white);border:1px solid var(--line);color:var(--navy)}.btn.dark{background:var(--navy);color:#fff}.btn.sm{padding:6px 10px;font-size:13px}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(8,8,40,.18)}.btn:not(:disabled):active{transform:scale(.97)}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff;color:var(--navy);max-width:100%}
textarea{width:100%;min-height:74px}
label{font-size:13px;font-weight:700;color:var(--teal-d);letter-spacing:.06em;text-transform:uppercase;display:block;margin:0 0 4px}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.pill{display:inline-block;background:var(--navy);color:#fff;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700}.pill.t{background:var(--teal);color:var(--navy)}
.code{font-family:"DejaVu Sans Mono",Consolas,monospace;font-weight:700;background:var(--ice);padding:3px 8px;border-radius:6px}
.note{font-size:13px;color:var(--muted)}
.callout{border-left:5px solid var(--teal);background:#E3F6F2;border-radius:8px;padding:10px 14px;font-weight:700}
table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--line);padding:6px 8px;text-align:center}
th{background:var(--navy);color:#fff;font-size:13px;letter-spacing:.06em;text-transform:uppercase}td.lab{text-align:start;font-weight:700;background:var(--ice)}.scroll{overflow-x:auto}
details summary{cursor:pointer;font-weight:700}
.chip{display:inline-block;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700;border:1px solid var(--line);background:#fff}
.chip.live{background:#E3F6F2;border-color:var(--teal);color:var(--teal-d)}.chip.off{background:#FFF1EC;border-color:var(--coral);color:#B2401F}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);margin-left:6px;vertical-align:middle}
.lv{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.lv button{flex:1;min-width:52px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 0;font:inherit;font-size:22px;font-weight:700;color:var(--navy);cursor:pointer;transition:transform .15s,background .2s,border-color .2s}
.lv button:hover{transform:translateY(-2px);border-color:var(--teal)}
.lv button.sel{color:#fff;animation:pop .3s ease}
.lv button.sel[data-v="1"]{background:var(--green);border-color:var(--green)}.lv button.sel[data-v="2"]{background:#8CC152;border-color:#8CC152}.lv button.sel[data-v="3"]{background:#F2B544;border-color:#F2B544;color:var(--navy)}.lv button.sel[data-v="4"]{background:#F08A4B;border-color:#F08A4B}.lv button.sel[data-v="5"]{background:var(--red);border-color:var(--red)}
.lvl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.opts{display:flex;gap:8px;flex-wrap:wrap}.opts button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer;color:var(--navy);transition:all .2s}
.opts button.sel{background:var(--teal);border-color:var(--teal)}
.dash{display:grid;gap:8px}.dash .r{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.dash .g{width:14px;height:14px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(47,182,124,.5);animation:greenPulse 2.2s infinite}
.dash .v{font-weight:700;font-size:20px;margin-right:12px}
.dashmini{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:0 0 12px}
.dashmini b{margin-right:4px}.dashmini .g{width:10px;height:10px;border-radius:50%;background:var(--green);display:inline-block;margin-right:5px;animation:greenPulse 2.2s infinite}
.dashmini span.it{font-size:14px;margin-right:8px;white-space:nowrap}
.sig{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-left:5px solid var(--red);border-radius:10px;padding:10px 12px;margin:0 0 8px}
.sig.ctx{border-left-color:#F2B544}.sig .f{flex:none;width:12px;height:12px;border-radius:50%;background:var(--red);margin-top:6px;animation:redPulse 1.6s infinite}.sig.ctx .f{background:#F2B544;animation:none}
.known .sig{opacity:.9;margin-bottom:6px;padding:7px 10px;font-size:14px}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.track{display:flex;align-items:center;margin:10px 0 2px}
.track .n{flex:none;width:32px;height:32px;border-radius:50%;background:#E3E9F5;color:var(--muted);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all .4s}
.track .n.done{background:var(--teal);color:var(--navy)}.track .n.cur{background:var(--navy);color:#fff;animation:curPulse 1.6s infinite}
.track .seg{flex:1;height:4px;background:#E3E9F5;position:relative;overflow:hidden}.track .seg i{position:absolute;inset:0;background:var(--teal);transform-origin:left;transform:scaleX(0);transition:transform .8s ease}.track .seg.full i{transform:scaleX(1)}
.bar{height:14px;background:#E3E9F5;border-radius:7px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--green));border-radius:7px;transition:width 1s ease}
.hb{display:flex;align-items:center;gap:10px;margin:5px 0}.hb .nm{width:110px;font-weight:700;font-size:14px}.hb .bar{flex:1}.hb .ct{width:28px;font-weight:700;text-align:end}
.proj table{font-size:24px}.proj th{font-size:16px}.proj td{padding:12px}
/* ---- game feel ---- */
.enter{animation:enter .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes greenPulse{0%{box-shadow:0 0 0 0 rgba(47,182,124,.5)}70%{box-shadow:0 0 0 9px rgba(47,182,124,0)}100%{box-shadow:0 0 0 0 rgba(47,182,124,0)}}
@keyframes redPulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.55)}70%{box-shadow:0 0 0 8px rgba(229,72,77,0)}100%{box-shadow:0 0 0 0 rgba(229,72,77,0)}}
@keyframes curPulse{0%,100%{box-shadow:0 0 0 0 rgba(8,8,40,.35)}50%{box-shadow:0 0 0 7px rgba(8,8,40,0)}}
.stagger{opacity:0;animation:rise .55s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.stamp{display:inline-block;animation:stamp .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stamp{0%{opacity:0;transform:scale(2.4) rotate(-12deg)}100%{opacity:1;transform:scale(1) rotate(-3deg)}}
.cnt.fu{color:var(--green)}
#splash{position:fixed;inset:0;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;pointer-events:none;opacity:0;animation:splash 1.7s ease forwards}
#splash .d{font-size:clamp(46px,13vw,110px);font-weight:700;letter-spacing:.06em;color:var(--teal);line-height:1}
#splash .s{font-size:clamp(18px,4.2vw,30px);opacity:.92;margin-top:10px;text-align:center;padding:0 22px}
#splash.hot .d{color:var(--coral)}
@keyframes splash{0%{opacity:0;transform:scale(1.06)}16%{opacity:1;transform:scale(1)}82%{opacity:1}100%{opacity:0;transform:scale(.98)}}
#toasts{position:fixed;right:14px;bottom:14px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--navy);color:#fff;border-left:5px solid var(--teal);border-radius:10px;padding:10px 14px;font-weight:700;box-shadow:0 6px 18px rgba(8,8,40,.3);animation:toast 3.4s ease forwards}
@keyframes toast{0%{opacity:0;transform:translateX(30px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0;transform:translateX(20px)}}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.3s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.stagger{opacity:1!important}.draw{stroke-dashoffset:0!important}#splash{display:none}}
@media(max-width:640px){h1{font-size:23px}main{padding:12px}.hb .nm{width:84px}}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cardk{position:relative;min-height:118px;perspective:800px}
.cardk .face{border-radius:14px;padding:12px;border:2px solid var(--line);background:#fff;height:100%;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;text-align:start}
.cardk button.face{cursor:pointer;font:inherit;color:#fff;background:var(--navy);border-color:var(--navy);transition:transform .15s,box-shadow .15s}
.cardk button.face:not(:disabled):hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(8,8,40,.25)}
.cardk button.face:disabled{opacity:.45;cursor:not-allowed}
.cardk .lbl{font-weight:700;font-size:15px}.cardk .q{font-size:12px;opacity:.85}.cardk .go{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);font-weight:700}
.cardk .face.sigf{border-color:var(--red);border-left:6px solid var(--red);background:#FFF5F5}
.cardk .face.nonef{background:#F4F7FC;border-style:dashed;color:var(--muted)}
.cardk .face.greenf{border-color:var(--green);border-left:6px solid var(--green);background:#EFFBF5}
.cardk .face .tt{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cardk .face.sigf .tt{color:var(--red)}.cardk .face.greenf .tt{color:var(--teal-d)}
.cardk .flipin{animation:cflip .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes cflip{0%{transform:perspective(700px) rotateY(-90deg);opacity:0}60%{transform:perspective(700px) rotateY(12deg);opacity:1}100%{transform:perspective(700px) rotateY(0)}}
.coins{display:flex;gap:6px;align-items:center}.coin{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE08A,#E5A100);border:2px solid #C98A00;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.coin.used{background:#E3E9F5;border-color:#CBD9F2;box-shadow:none;animation:coinDrop .5s ease}
@keyframes coinDrop{0%{transform:translateY(-14px) scale(1.3);opacity:.2}100%{transform:none;opacity:1}}
.timer{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}.timer.low{color:var(--red);animation:pop .5s ease infinite}
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tilew{border-radius:12px;padding:12px 14px;margin:0 0 8px;border:1px solid var(--line);background:#fff}
.tilew.found{border-left:6px solid var(--red);background:#FFF5F5}.tilew.hiddenw{background:var(--navy);color:#fff;border-color:var(--navy)}.tilew.missedw{border-left:6px solid #F2B544;background:#FFF8EA}
.tilew .by{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}.gd2{width:24px;height:24px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.dist .rw{display:flex;align-items:center;gap:10px;margin:6px 0}.dist .n{width:22px;font-weight:700}.dist .b{flex:1;height:26px;background:#E3E9F5;border-radius:8px;overflow:hidden}.dist .b i{display:block;height:100%;width:0;border-radius:8px;transition:width .9s cubic-bezier(.2,.8,.2,1)}.dist .c{width:30px;text-align:end;font-weight:700}
.board .rw{display:flex;align-items:center;gap:10px;margin:6px 0}.board .nm{width:76px;font-weight:700}.board .b{flex:1;height:20px;background:#E3E9F5;border-radius:8px;overflow:hidden}.board .b i{display:block;height:100%;width:0;border-radius:8px;transition:width .9s ease}.board .c{width:64px;text-align:end;font-weight:700}
.nothing{color:var(--muted)}
.projbig .timer{font-size:56px}.projbig h1{font-size:34px}
/* ---- right-to-left (Arabic) ---- */
html[dir=rtl] body{font-family:"Segoe UI",Tahoma,"Noto Sans Arabic","Noto Naskh Arabic",Calibri,Carlito,sans-serif}
html[dir=rtl] *{letter-spacing:0!important}
html[dir=rtl] label,html[dir=rtl] th,html[dir=rtl] .tag,html[dir=rtl] .k{text-transform:none}
html[dir=rtl] svg{direction:ltr}
html[dir=rtl] header.top nav{margin-left:0;margin-right:auto}
html[dir=rtl] .callout{border-left:0;border-right:5px solid var(--teal)}
html[dir=rtl] .warn{border-left:1px solid var(--line);border-right:6px solid var(--coral)}
html[dir=rtl] .sig{border-left:1px solid var(--line);border-right:5px solid var(--red)}
html[dir=rtl] .sig.ctx{border-right-color:#F2B544}
html[dir=rtl] .cardk .face.sigf,html[dir=rtl] .cardk .face.greenf{border-left-width:2px;border-right-width:6px}
html[dir=rtl] .tilew.found,html[dir=rtl] .tilew.missedw{border-left:1px solid var(--line);border-right:6px solid var(--red)}
html[dir=rtl] .tilew.missedw{border-right-color:#F2B544}
html[dir=rtl] .toast{border-left:0;border-right:5px solid var(--teal)}
html[dir=rtl] #toasts{right:auto;left:14px}
html[dir=rtl] td.lab,html[dir=rtl] .opt,html[dir=rtl] .cardk .face,html[dir=rtl] #alertmodal table{text-align:right}
html[dir=rtl] .dot{margin-left:0;margin-right:6px}
html[dir=rtl] .dist .c,html[dir=rtl] .board .c,html[dir=rtl] .hb .ct{text-align:left}
header.top .lang{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
header.top .lang:hover{background:rgba(255,255,255,.12)}

</style>

const LANG_KEY = "gn.lang";
const AR_RE = I18N.re.map(([s,r])=>[new RegExp(s),r]);
const AR_HTML = I18N.html.map(([s,r,isRe])=>[isRe?new RegExp(s,"g"):s,r,isRe]);
let LANG = (()=>{ const q=new URLSearchParams(location.search).get("lang")||new URLSearchParams((location.hash.split("?")[1])||"").get("lang");
  if(q==="ar"||q==="en"){ try{ localStorage.setItem(LANG_KEY,JSON.stringify(q)); }catch(e){} return q; }
  try{ return JSON.parse(localStorage.getItem(LANG_KEY)||"null")==="ar" ? "ar" : "en"; }catch(e){ return "en"; } })();
const isAr = () => LANG==="ar";
function applyDir(){ document.documentElement.lang=LANG; document.documentElement.dir=isAr()?"rtl":"ltr"; document.title=isAr()?I18N.title:I18N.titleEn; }
const daysAr = n => n===1 ? "يوم واحد" : (n===2 ? "يومان" : n+" أيام");
function trCore(core){
  if(I18N.exact[core]!==undefined) return I18N.exact[core];
  for(const [re,rep] of AR_RE){ const m=re.exec(core); if(m) return rep.replace(/\$([DT]?)(\d)/g,(_,k,i)=>{ const v=m[+i]; return k==="D" ? daysAr(+v) : (k==="T" ? trCore(v) : v); }); }
  if(core.includes(", ")){ const ps=core.split(", "); if(ps.every(p=>I18N.exact[p]!==undefined)) return ps.map(p=>I18N.exact[p]).join("، "); }
  return core;

  SYNC.es=es; es.onopen=()=>{ SYNC.fail=0; setStatus("live"); };
  es.onmessage=ev=>{ try{ const m=JSON.parse(ev.data); if(m.event && m.event!=="message") return; if(m.id){ if(SYNC.seen.has(m.id)) return; SYNC.seen.add(m.id); SYNC.last=m.id; } onSyncMessage(JSON.parse(m.message)); }catch(e){} };
  es.onerror=()=>{ SYNC.fail++; setStatus(SYNC.fail>=2?"off":"connecting"); try{es.close();}catch(e){} SYNC.es=null; SYNC.timer=setTimeout(syncConnect,2500); };

function briefing(){ const c=DATA.case; return `<div class="card"><h2>Meet ${esc(c.name)}</h2><p style="font-size:19px;font-weight:700;margin:0 0 8px">${esc(c.name)}, ${esc(c.role)}</p><div class="row" style="gap:8px;margin-bottom:10px">${c.profile.map(p=>`<span class="pill">${esc(p)}</span>`).join("")}</div><div class="callout">${esc(c.rule)}</div></div>`; }

/* ===================== group ===================== */
const myVote = s => (GRP.myVote||{})[s];
function levelPicker(cur){ const d=DRAFT.l ?? (myVote(cur)&&myVote(cur).v); return `<label>My concern level</label><div class="lv">${[1,2,3,4,5].map(v=>`<button data-act="lvl" data-v="${v}" class="${d===v?"sel":""}">${v}</button>`).join("")}</div><div class="lvl"><span>1 = ${esc(DATA.scale.low)}</span><span>5 = ${esc(DATA.scale.high)}</span></div>`; }
let DRAFT={};
function tagsPicker(st){ if(!st.tags) return ""; const sel=DRAFT.tags ?? ((myVote(st.n)&&myVote(st.n).tags)||[]); return `<div style="margin-top:12px"><label>${esc(st.tagAsk)}</label><div class="opts">${st.tags.map(k=>`<button data-act="tag" data-k="${esc(k)}" class="${sel.includes(k)?"sel":""}">${esc(k)}</button>`).join("")}</div></div>`; }
function voteCard(cur){
  const st=ST[cur-1], saved=myVote(cur), d=DRAFT.l ?? (saved&&saved.v), shown=GRP.room.shown[cur];
  return `<div class="card"><h2>${cur===1?"How concerned should the manager be?":"Now vote on your own"}</h2><p class="note" style="margin:0 0 8px">${cur===1?"Each person votes alone on their own phone.":"Talk it over, then each person votes alone."}</p>${levelPicker(cur)}${tagsPicker(st)}
  <div class="row" style="margin-top:12px"><button class="btn" data-act="vote" ${d?"":"disabled"}>${saved?"Update my vote":"Lock my vote"}</button>${saved?`<span class="note">Vote sent ✓ ${shown?"":"(you can change it until the results are shown)"}</span>`:""}</div></div>`;
}
function resultsCard(cur){
  const room=GRP.room, gs=groupsIn(room);

  ${cur>=2?`<h3 style="margin-top:14px">Signals the groups found</h3>${wallHtml(room,cur,GRP.n)}<h3 style="margin-top:10px">Signals spotted this stage</h3>${boardHtml(room,cur,gs)}`:""}</div>`;
}
function cardsHtml(cur){
  const room=GRP.room, st=ST[cur-1], mine=flipsOf(room,GRP.n,cur), left=tokensLeft(room,GRP.n,cur), open=remaining(room,cur)>0 && left>0;
  return `<div class="cards">${st.checks.map((c,k)=>{
    if(mine.includes(k)){ const key=`f${cur}-${k}`, isNew=!ANIMATED.has(key); ANIMATED.add(key); const cl=c.reveal===null?"nonef":(c.tone==="green"?"greenf":"sigf");
      return `<div class="cardk"><div class="face ${cl} ${isNew&&!REDUCED()?"flipin":""}"><span class="tt">${c.reveal===null?"Nothing new":(c.tone==="green"?"Still green":"Red signal")} · ${esc(c.label)}</span><span class="${c.reveal===null?"nothing":""}" style="font-weight:700">${esc(c.reveal===null?c.none:st.facts[c.reveal])}</span></div></div>`; }
    return `<div class="cardk"><button class="face" data-act="flip" data-k="${k}" ${open?"":"disabled"}><span class="lbl">${esc(c.label)}</span><span class="q">${esc(c.q)}</span><span class="go">${open?"Check this":"Not checked"}</span></button></div>`; }).join("")}</div>`;
}
function hudHtml(cur){
  const room=GRP.room, c=room.cfg[cur]; if(!c) return "";

  return `<div class="card"><div class="hud"><div><label>Time left to look around</label><span class="timer ${rem<=10?"low":""}" data-timer="${cur}">${mm(rem)}</span></div>
  <div><label>Our check-ins</label><div class="coins">${Array.from({length:c.tokens},(_,i)=>`<span class="coin ${i<c.tokens-left?"used":""}"></span>`).join("")}</div><div class="note">${left} left · the whole group shares them</div></div></div>
  <p class="note" style="margin:8px 0 0">${esc(DATA.mechanics.intro)}</p></div>`;
}
function backupCard(cur){ return `<details class="card"><summary>Phone not updating? Enter the code for the next stage</summary><div class="row" style="margin-top:8px"><input data-act="gcode" inputmode="numeric" maxlength="4" placeholder="4-digit code" size="8"><button class="btn" data-act="unlock">Open ${phaseName(cur+1)}</button></div><p class="note" id="gmsg"></p></details>`; }
function viewGroup(q){
  if(q.s){ GRP.session=q.s; GRP.codes=q.c!=="0"; if(q.g && !GRP.n) GRP.n=+q.g; saveGrp(); }
  if(!GRP.n){
    return shell(`<h1>Join as a group</h1><div class="card"><div class="row"><div><label>Group number</label><select data-act="gnum">${[1,2,3,4,5,6,7,8].map(x=>`<option>${x}</option>`).join("")}</select></div>
    <div><label>Session code</label><input data-act="gsession" value="${esc(GRP.session||"")}" size="10" placeholder="e.g. K7M2QX"></div><button class="btn" data-act="join">Join</button></div>

  if(cur===0){
    return shell(`${top}${briefing()}<div class="card"><h2>Waiting for the facilitator</h2><p>Your facilitator will open Stage 1 for everyone. This screen updates by itself.</p>
     <details><summary>Not updating? Enter the code instead</summary><div class="row" style="margin-top:8px"><input data-act="gcode" inputmode="numeric" maxlength="4" placeholder="4-digit code" size="8"><button class="btn" data-act="unlock">Open Stage 1</button></div><p class="note" id="gmsg"></p></details></div>`, "#/group");
  }
  if(cur===1){
    return shell(`${top}<div class="card"><span class="pill">Stage 1</span><h2 style="margin-top:8px">${esc(ST[0].title)}</h2><p class="note">${esc(ST[0].lead)}</p>${dashFull()}</div>${voteCard(1)}${room.shown[1]?resultsCard(1):""}${backupCard(1)}`, "#/group");
  }
  if(cur>=2 && cur<=NS){
    const st=ST[cur-1];
    return shell(`${top}${dashStrip()}<div class="card"><span class="pill">Stage ${cur}</span><h2 style="margin-top:8px">${esc(st.title)}</h2><p class="note">${esc(st.lead)}. Where do you look?</p></div>${hudHtml(cur)}${cardsHtml(cur)}<div style="height:12px"></div>${voteCard(cur)}${room.shown[cur]?resultsCard(cur):""}${backupCard(cur)}`, "#/group");
  }
  if(cur===FINAL){
    const found=new Set(); [2,3,4,5].forEach(s=>flipsOf(room,GRP.n,s).forEach(k=>{ const c=ST[s-1].checks[k]; if(c&&c.reveal!==null) found.add(s+":"+c.reveal); }));
    const picture=[2,3,4,5].map(s=>`<div class="tag" style="margin:10px 0 4px">Stage ${s} · ${esc(ST[s-1].lead)}</div>`+ST[s-1].facts.map((f,i)=>{ const got=found.has(s+":"+i); return `<div class="sig ${s===5?"ctx":""} ${ANIM_NOW?"stagger":""}" style="animation-delay:${(0.2+(s*4+i-8)*0.12).toFixed(2)}s;${got?"":"opacity:.75;border-left-color:#F2B544"}"><span class="f" ${got?"":'style="background:#F2B544;animation:none"'}></span><span>${esc(f)} <span class="note">${got?"· we found this":"· we missed this"}</span></span></div>`; }).join("")).join("");
    const fin=DATA.final, d=DRAFT.l ?? (myVote(FINAL)&&myVote(FINAL).v), c=DRAFT.c ?? (myVote(FINAL)&&myVote(FINAL).c), saved=myVote(FINAL);
    const first=myVote(1)&&myVote(1).v;
    return shell(`${top}<div class="card"><h2>The full picture</h2><p class="note">Everything the team could have seen. Your group found <b>${found.size}</b> of ${REV_TOTAL}.</p>${picture}</div>

      <div style="margin-top:14px"><label>${esc(fin.q)}</label><div class="opts">${fin.options.map(o=>`<button data-act="fopt" data-v="${esc(o)}" class="${c===o?"sel":""}">${esc(o)}</button>`).join("")}</div></div>
      <div style="margin-top:10px"><label>${esc(fin.ask)}</label><textarea data-act="txt" placeholder="One or two sentences">${esc(DRAFT.t ?? (saved&&saved.t) ?? "")}</textarea></div>
      <div class="row" style="margin-top:12px"><button class="btn" data-act="vote" ${d&&c?"":"disabled"}>${saved?"Update my answer":"Send my answer"}</button>${saved?'<span class="note">Sent ✓</span>':""}</div></div>
     ${room.shown[FINAL]?`<div class="card"><h2>Results</h2><h3>Concern after seeing everything</h3>${distHtml(room,FINAL,"gf")}<h3 style="margin-top:14px">${esc(fin.q)}</h3>${finalTally(room)}</div>`:""}`, "#/group");
  }
  const vals=[1,2,3,4,5,FINAL].map(s=>myVote(s)?myVote(s).v:null), av=[1,2,3,4,5,FINAL].map(s=>{ const a=avgOf(room,s); return a==null?null:Math.round(a*100)/100; });
  return shell(`${top}<h1>What happened?</h1><p class="lead">Your votes next to the room, and a dashboard that never left green.</p>
   <div class="card">${journeyChart([{name:"My vote",color:"#F26A44",vals},{name:"Room average",color:"#080828",vals:av,w:5,dash:true}],["Stage 1","2","3","4","5","Final"])}</div>
   <div class="callout ${ANIM_NOW?"stagger":""}" style="animation-delay:.6s">${esc(DATA.closing[0])}<div style="font-weight:400;margin-top:4px">${esc(DATA.closing[1])}</div></div>`, "#/group");
}
function finalTally(room){ const t={}; DATA.final.options.forEach(o=>t[o]=0); votesOf(room,FINAL).forEach(x=>{ if(x.c) t[x.c]=(t[x.c]||0)+1; }); const n=Math.max(1,Object.values(t).reduce((a,b)=>a+b,0)); return Object.entries(t).map(([k,v])=>`<div class="rw" style="display:flex;gap:10px;align-items:center;margin:6px 0"><span style="width:70px;font-weight:700">${esc(k)}</span><div class="b" style="flex:1;height:22px;background:#E3E9F5;border-radius:8px;overflow:hidden"><i data-k="ft${k}" data-w="${Math.round(v/n*100)}" style="display:block;height:100%;width:0;background:var(--teal);transition:width .9s"></i></div><b>${v}</b></div>`).join(""); }

/* ===================== facilitator and projector ===================== */
function trainerHtml(cur){ const t=DATA.trainer, txt=t[String(cur)]; return `<div class="card"><h2>Trainer notes <span class="note">(facilitator only)</span></h2><div class="callout" style="font-weight:400">${esc(t.general)}</div>${txt?`<p style="margin-top:10px"><b>${phaseName(cur)}:</b> ${esc(txt)}</p>`:""}</div>`; }
function liveTable(room,cur){
  const gs=groupsIn(room); if(!gs.length) return '<p class="note">No groups yet.</p>';
  return `<div class="scroll"><table><tr><th></th><th>Phones</th><th>Check-ins used</th><th>Checked</th><th>Signals found</th><th>Votes in</th></tr>${gs.map(g=>{
    const ph=Object.keys(room.online[g]||{}).length, fl=cur>=2&&cur<=NS?flipsOf(room,g,cur):[], c=room.cfg[cur];
    const names=fl.map(k=>ST[cur-1].checks[k].label).join(", "), vt=votesOf(room,cur).filter(x=>x.g===g).length;
    return `<tr><td class="lab" style="color:${GCOL[(g-1)%GCOL.length]}">Group ${g}</td><td>${ph}</td><td>${c&&cur>=2&&cur<=NS?fl.length+" / "+c.tokens:"—"}</td><td style="text-align:start">${esc(names)||"—"}</td><td>${cur>=2&&cur<=NS?foundCount(room,g,cur):"—"}</td><td>${vt} / ${ph}</td></tr>`; }).join("")}</table></div>`;
}
function viewFacilitator(){
  const room=FAC.room, cur=room.cur, n=FAC.groups;
  const link=location.href.split("#")[0]+`#/group?s=${encodeURIComponent(FAC.session)}&c=1`;
  const label=cur===0?"not started yet":phaseName(cur);
  const btns=[...Array.from({length:NS},(_,i)=>i+1),FINAL,DEBRIEF].map(r=>`<button class="btn ${cur===r?"":"sec"}" data-act="opencur" data-v="${r}">${cur===r?phaseName(r)+" · open":"Open "+phaseName(r)}</button>`).join(" ");
  const canShow=cur>=1&&cur<=FINAL;
  const showBtns=canShow?`<div class="row" style="margin-top:10px"><button class="btn dark" data-act="show" ${room.shown[cur]?"disabled":""}>${room.shown[cur]?"Results shown ✓":"Show results"}</button>${cur>=2&&cur<=NS?`<button class="btn sec" data-act="missed" ${room.missed[cur]?"disabled":""}>${room.missed[cur]?"Missed signals shown ✓":"Reveal what nobody found"}</button>`:""}</div>`:"";
  const rem=cur>=2&&cur<=NS?remaining(room,cur):null;
  return shell(`<h1>Facilitator console</h1><p class="lead">Now showing: <b>${label}</b>. <span id="syncchip" class="chip"></span> Everything arrives by itself.</p>
  <div class="card"><details><summary>Setup and group link</summary><div class="row" style="margin-top:10px">
   <div><label>Groups</label><select data-act="groups">${[2,3,4,5,6,7,8].map(x=>`<option ${x===n?"selected":""}>${x}</option>`).join("")}</select></div>
   <div><label>Check-ins per stage</label><select data-act="tokens">${[2,3,4].map(x=>`<option ${x===FAC.tokens?"selected":""}>${x}</option>`).join("")}</select></div>
   <div><label>Time to look around (seconds)</label><select data-act="dur">${[60,90,120,150,180,240].map(x=>`<option ${x===FAC.dur?"selected":""}>${x}</option>`).join("")}</select></div>
   <div><label>Session code</label><input data-act="session" value="${esc(FAC.session)}" size="10"></div><button class="btn sec sm" data-act="newsession">New session code</button></div>
   <p class="note" style="margin-top:10px">Check-ins and time apply when you open a stage. Live sync uses the free public relay ntfy.sh with a private topic made from your session code, so use a new session code for every session. The hidden content is part of the page code, so treat this as a classroom tool, not a secure exam.</p>
   <p style="margin-top:8px"><label>Link to send to the groups (everyone in a group uses the same link)</label><span class="code" style="word-break:break-all">${esc(link)}</span> <button class="btn sec sm" data-act="copylink">Copy</button> <button class="btn sec sm" data-act="copylinkar">Copy Arabic link</button></p></details></div>
  <div class="card"><h2>Run the stages</h2><div class="row">${btns}</div>${showBtns}${rem!==null?`<p style="margin-top:10px">Time left: <span class="timer ${rem<=10?"low":""}" data-timer="${cur}">${mm(rem)}</span></p>`:""}
   ${(cur>=1&&cur<=NS)?`<p class="note" style="margin-top:10px">Backup code for ${phaseName(cur)} (only for a phone that is offline): <span class="code">${roundCode(FAC.session,cur)}</span></p>`:""}
   ${cur===0?'<p class="note" style="margin-top:10px">Nothing is open yet. Press Open Stage 1 when everyone has read the case.</p>':""}</div>
  ${trainerHtml(cur)}

      <div class="grid g2"><div class="card"><h2>${room.shown[FINAL]?"Concern after seeing everything":"Answers in"}</h2>${room.shown[FINAL]?distHtml(room,FINAL,"pf"):`<p style="font-size:34px;font-weight:700">${cnt("pfn",votesOf(room,FINAL).length,0)} <span style="font-size:18px;font-weight:400">answers</span></p>`}</div>

      ${room.shown[FINAL]&&first!=null&&now!=null?`<div class="grid gd"><div class="card" style="text-align:center"><div class="tag">First vote (average)</div><div style="font-size:42px;font-weight:700">${Math.round(first*10)/10}</div></div><div class="card" style="text-align:center"><div class="tag">After seeing everything</div><div style="font-size:42px;font-weight:700;color:var(--red)">${Math.round(now*10)/10}</div></div><div class="card" style="text-align:center"><div class="tag">People who moved up</div><div style="font-size:42px;font-weight:700">${moved} <span style="font-size:18px">of ${both}</span></div></div></div>`:""}</div>`, "#/debrief");
  }
  const labels=["Stage 1","2","3","4","5","Final"], av=[1,2,3,4,5,FINAL].map(s=>{ const a=avgOf(room,s); return a==null?null:Math.round(a*100)/100; });
  const series=[{name:"Room average",color:"#080828",vals:av,w:6}];

  return shell(`<div class="projbig"><h1>Debrief</h1><p class="lead">The dashboard stayed green. Look at what the groups noticed, and what they missed.</p>

   <div class="grid g2"><div class="card"><h2>Signals spotted</h2>${boardHtml(room,0,gs)}</div><div class="card"><h2>${esc(DATA.final.q)}</h2>${finalTally(room)}</div></div>

}
function viewHome(){ return shell(`<h1>Green Numbers, Red Signals</h1><p class="lead">An online case in stages. The numbers stay green. Where will you look?</p>
  <div class="grid g2"><div class="card"><h2>Facilitator</h2><p>Open each stage, watch the groups look around, show the votes and run the debrief. A code is required.</p><a class="btn" href="#/facilitator">Open the console</a> <a class="btn sec" href="#/debrief">Projector page</a></div>

function viewGate(target){ return shell(`<h1>Facilitator access</h1><div class="card" style="max-width:420px"><label>Facilitator code</label><div class="row"><input data-act="pin" type="password" inputmode="numeric" maxlength="8" size="10"><button class="btn" data-act="pinok" data-target="${target}">Open</button></div><p class="note" id="pinmsg"></p></div>`, "#/"); }

/* ===================== router + events ===================== */
const facOK = () => sessionStorage.getItem("gn.ok")==="1";
function screenKey(path){ if(path==="#/group"){ return GRP.n ? "g-"+GRP.room.cur : "g-join"; } if(path==="#/debrief") return "p-"+FAC.room.cur; return path; }
function splashFor(path, fresh){
  if(!(fresh && path==="#/group" && GRP.n)) return null; const cur=GRP.room.cur; if(cur<1 || cur===DEBRIEF) return null; if(GRP.splashed[cur]) return null; GRP.splashed[cur]=true; saveGrp();
  if(cur===FINAL) return {big:"FINAL", small:"The full picture", hot:true, s:1};
  return {big:"STAGE "+cur, small:ST[cur-1].title, hot:cur>=4, s:cur};
}
function afterRender(path, fresh){
  if(!fresh) return;
  if(path==="#/group" && GRP.n){ const cur=GRP.room.cur; if(cur===1) setTimeout(()=>sfx("green"),300); if(cur===DEBRIEF) sfx("fanfare"); }
  if(path==="#/debrief" && FAC.room.cur===DEBRIEF) sfx("fanfare");
}
function route(){
  const raw=location.hash||"#/"; const [path,qs]=raw.split("?"); const q=Object.fromEntries(new URLSearchParams(qs||""));
  if((path==="#/facilitator"||path==="#/debrief") && !facOK()){ syncStop(); $("#app").innerHTML=trHtml(viewGate(path)); const i=$("[data-act=pin]"); if(i) i.focus(); return; }
  if(path==="#/facilitator"||path==="#/debrief") syncStart(FAC.session,"fac"); else if(path==="#/group" && GRP.n && GRP.session) syncStart(GRP.session,"group"); else syncStop();
  const key=screenKey(path), fresh=key!==LAST_KEY; ANIM_NOW = fresh && !REDUCED();
  let html;
  if(path==="#/facilitator") html=viewFacilitator(); else if(path==="#/debrief") html=viewProjector(); else if(path==="#/group") html=viewGroup(q); else html=viewHome();
  html=trHtml(html);
  const sp=REDUCED()?null:splashFor(path,fresh);
  const commit=()=>{ $("#app").innerHTML=html; setStatus(SYNC.status); LAST_KEY=key; if(fresh) FRESH_T=Date.now();
    if(fresh && !REDUCED()){ const m=$("#app main"); if(m){ m.classList.add("enter"); STATS.enter++; } }
    runFx(fresh); afterRender(path,fresh); };
  if(sp){ const tok=++TOKEN; LAST_KEY=key; FRESH_T=Date.now(); showSplash(sp.big,sp.small,sp.hot); sfx("stage",sp.s); if(sp.hot) setTimeout(()=>sfx("alarm"),900); setTimeout(()=>{ if(tok===TOKEN) commit(); },1300); return; }
  TOKEN++; commit();
}
window.addEventListener("hashchange",()=>route());
/* timers: updated in place every 250 ms; when time runs out the cards lock once */
const TIMEUP=new Set();
setInterval(()=>{
  document.querySelectorAll("[data-timer]").forEach(el=>{ const s=+el.dataset.timer, room=roomNow(), r=remaining(room,s); el.textContent=mm(r); el.classList.toggle("low",r<=10 && r>0);
    if(r>0 && r<=5 && Math.ceil(r)!==el._last && !isFacRoute()){ el._last=Math.ceil(r); sfx("tick"); }
    if(r<=0 && room.cfg[s] && !TIMEUP.has(s+"|"+room.cfg[s].ts)){ TIMEUP.add(s+"|"+room.cfg[s].ts); if(!isFacRoute()) sfx("error"); softRender(true); } });
},250);
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act; if(!["lvl","snd","flip"].includes(a)) sfx("tap");
  if(a==="lang"){ LANG=isAr()?"en":"ar"; try{ localStorage.setItem(LANG_KEY,JSON.stringify(LANG)); }catch(e){} applyDir(); route(); return; }
  if(a==="copylinkar"){ copy($(".code[style*='break-all']").textContent+"&lang=ar", b); return; }
  if(a==="snd"){ const on=!soundEnabled(); save("gn.snd",on); if(on) sfx("ping"); route(); return; }
  if(a==="pinok"){ if($("[data-act=pin]").value.trim()===FAC_PIN){ sessionStorage.setItem("gn.ok","1"); sfx("unlock"); location.hash=b.dataset.target; route(); } else { sfx("error"); $("#pinmsg").textContent=trText("Wrong code."); } return; }
  if(a==="opencur"){ const v=+b.dataset.v; const msg={t:"cur",cur:v,open:Date.now(),dur:FAC.dur,tokens:FAC.tokens}; applyMsg(FAC.room,msg); saveFac(); route(); syncSend(msg); return; }
  if(a==="show"||a==="missed"){ const cur=FAC.room.cur, msg={t:"show",s:cur,missed:a==="missed"}; applyMsg(FAC.room,msg); saveFac(); sfx(a==="missed"?"missed":"results"); route(); syncSend(msg); return; }
  if(a==="copylink"){ copy($(".code[style*='break-all']").textContent, b); return; }
  if(a==="newsession"){ if(confirm(trText("Create a new session code? Groups will need the new link."))){ FAC.session=rnd(6); FAC.room=newRoom(); saveFac(); syncStop(); route(); } return; }
  if(a==="export"){ copy(JSON.stringify(FAC), b); return; }
  if(a==="reset"){ if(confirm(trText("Reset the whole facilitator session? A new session code is created."))){ FAC={session:rnd(6),groups:5,tokens:FAC.tokens,dur:FAC.dur,room:newRoom()}; saveFac(); syncStop(); route(); } return; }
  if(a==="join"){ const n=+$("[data-act=gnum]").value, s=$("[data-act=gsession]").value.trim(); if(!s){ alert(trText("Enter the session code.")); return; } GRP={n,pid:GRP.pid||("p"+rnd(7)),session:s,codes:GRP.codes!==false,room:newRoom(),myVote:{},splashed:{}}; DRAFT={}; saveGrp(); sfx("join"); route(); syncSend({t:"hello",g:n,pid:GRP.pid}); return; }
  if(a==="gleave"){ if(confirm(trText("Leave this group on this phone?"))){ GRP={n:null,pid:GRP.pid,session:GRP.session,codes:GRP.codes,room:newRoom(),myVote:{},splashed:{}}; DRAFT={}; saveGrp(); route(); } return; }
  if(a==="unlock"){ const v=$("[data-act=gcode]").value.trim(), nx=GRP.room.cur+1; if(v===roundCode(GRP.session,nx)){ applyMsg(GRP.room,{t:"cur",cur:nx,open:Date.now(),dur:DATA.mechanics.duration,tokens:DATA.mechanics.tokens}); saveGrp(); sfx("unlock"); route(); } else { sfx("error"); $("#gmsg").textContent=trText("That code is not right. Check with your facilitator."); } return; }
  if(a==="flip"){ const cur=GRP.room.cur, k=+b.dataset.k; if(!(remaining(GRP.room,cur)>0 && tokensLeft(GRP.room,GRP.n,cur)>0) || flipsOf(GRP.room,GRP.n,cur).includes(k)) return; sfx("coin");
    const msg={t:"flip",g:GRP.n,s:cur,k,pid:GRP.pid}; if(live()){ syncSend(msg); } else { if(applyMsg(GRP.room,msg)){ saveGrp(); const c=ST[cur-1].checks[k]; sfx(c.reveal!==null?(c.tone==="green"?"green":"signal"):"none"); route(); } } return; }
  if(a==="lvl"){ DRAFT.l=+b.dataset.v; sfx("level",DRAFT.l); route(); return; }
  if(a==="tag"){ const cur=GRP.room.cur, base=DRAFT.tags ?? ((myVote(cur)&&myVote(cur).tags)||[]), k=b.dataset.k; DRAFT.tags=base.includes(k)?base.filter(x=>x!==k):[...base,k]; route(); return; }
  if(a==="fopt"){ DRAFT.c=b.dataset.v; route(); return; }
  if(a==="vote"){
    const cur=GRP.room.cur, prev=myVote(cur)||{}; const v=DRAFT.l ?? prev.v;
    const msg={t:"vote",g:GRP.n,pid:GRP.pid,s:cur,v}; let rec={v};
    if(cur===FINAL){ msg.c=DRAFT.c ?? prev.c; msg.t2=DRAFT.t ?? prev.t; rec.c=msg.c; rec.t=msg.t2; }
    else { const tags=DRAFT.tags ?? prev.tags; if(tags){ msg.tags=tags; rec.tags=tags; } }
    GRP.myVote[cur]=rec; applyMsg(GRP.room,msg); DRAFT={}; saveGrp(); sfx("send"); route(); syncSend(msg); return;
  }
});
document.addEventListener("change",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return; const a=el.dataset.act;
  if(a==="groups"){ FAC.groups=+el.value; saveFac(); route(); } else if(a==="tokens"){ FAC.tokens=+el.value; saveFac(); route(); } else if(a==="dur"){ FAC.dur=+el.value; saveFac(); route(); }
  else if(a==="session"){ FAC.session=el.value.trim()||rnd(6); FAC.room=newRoom(); saveFac(); syncStop(); route(); }
});
document.addEventListener("input",e=>{ const el=e.target.closest("[data-act=txt]"); if(el) DRAFT.t=el.value; });
document.addEventListener("keydown",e=>{ if(e.key==="Enter" && e.target.matches("[data-act=pin]")) $("[data-act=pinok]").click(); });
window.L5 = {STATS, DATA, topicOf, roundCode, applyMsg, get FAC(){return FAC;}, get GRP(){return GRP;}, get SYNC(){return SYNC;}};
route();
</script>
